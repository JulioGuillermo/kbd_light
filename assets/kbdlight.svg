<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- kbdlight: a night-blue keyboard whose keys glow, with a red underglow (Brasa's Redline colors) -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="62%" r="55%">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#c00000" stop-opacity=".35"/>
      <stop offset="1" stop-color="#c00000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15264f"/>
      <stop offset="1" stop-color="#0a1430"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#00040f"/>
  <ellipse cx="64" cy="78" rx="58" ry="40" fill="url(#glow)"/>
  <rect x="16" y="44" width="96" height="58" rx="11" fill="url(#body)" stroke="#ff0000" stroke-width="2"/>
  <g fill="#ffffff">
    <g filter="url(#soft)" opacity=".55">
      <rect x="24" y="52" width="10" height="9" rx="2.5"/><rect x="37" y="52" width="10" height="9" rx="2.5"/>
      <rect x="50" y="52" width="10" height="9" rx="2.5"/><rect x="63" y="52" width="10" height="9" rx="2.5"/>
      <rect x="76" y="52" width="10" height="9" rx="2.5"/><rect x="89" y="52" width="15" height="9" rx="2.5"/>
      <rect x="24" y="65" width="15" height="9" rx="2.5"/><rect x="42" y="65" width="10" height="9" rx="2.5"/>
      <rect x="55" y="65" width="10" height="9" rx="2.5"/><rect x="68" y="65" width="10" height="9" rx="2.5"/>
      <rect x="81" y="65" width="23" height="9" rx="2.5"/>
      <rect x="24" y="78" width="10" height="9" rx="2.5"/><rect x="37" y="78" width="54" height="9" rx="2.5"/>
      <rect x="94" y="78" width="10" height="9" rx="2.5"/>
    </g>
    <g opacity=".95">
      <rect x="24" y="52" width="10" height="9" rx="2.5"/><rect x="37" y="52" width="10" height="9" rx="2.5"/>
      <rect x="50" y="52" width="10" height="9" rx="2.5"/><rect x="63" y="52" width="10" height="9" rx="2.5"/>
      <rect x="76" y="52" width="10" height="9" rx="2.5"/><rect x="89" y="52" width="15" height="9" rx="2.5"/>
      <rect x="24" y="65" width="15" height="9" rx="2.5"/><rect x="42" y="65" width="10" height="9" rx="2.5"/>
      <rect x="55" y="65" width="10" height="9" rx="2.5"/><rect x="68" y="65" width="10" height="9" rx="2.5"/>
      <rect x="81" y="65" width="23" height="9" rx="2.5"/>
      <rect x="24" y="78" width="10" height="9" rx="2.5"/><rect x="37" y="78" width="54" height="9" rx="2.5"/>
      <rect x="94" y="78" width="10" height="9" rx="2.5"/>
    </g>
  </g>
  <!-- light rays above the keyboard -->
  <g stroke="#ff3030" stroke-width="4" stroke-linecap="round">
    <path d="M64 16 V30"/><path d="M40 22 L46 33"/><path d="M88 22 L82 33"/>
  </g>
</svg>
